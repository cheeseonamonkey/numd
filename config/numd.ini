# Edit here after installation: /etc/numd/config.ini
# auto: first /dev/input/by-id/*-event-kbd, then /dev/input/by-path/*-event-kbd
# Prefer an explicit device symlink if multiple keyboards are connected.
[device]
path = auto

# Hold Num Lock + a numpad key to send these shortcuts.
# Tap Num Lock alone for its usual toggle; ordinary numpad input is untouched.
# Customize these to match your compositor/desktop shortcuts.
[bindings]
kp7 = "super+7"
kp8 = "super+8"
kp9 = "super+9"
kp4 = "super+left"
kp5 = "super+up"
kp6 = "super+right"
kp1 = "super+1"
kp2 = "super+2"
kp3 = "super+3"
kp0 = "ctrl+alt+t"
kpdot = "printscreen"
